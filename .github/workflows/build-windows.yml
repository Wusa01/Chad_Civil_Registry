
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify required files
        shell: pwsh
        run: |
          $files = @(
            "desktop.py",
            "ChadCivilRegistry.spec",
            "installer/ChadCivilRegistry.iss",
            "app/static/images/chad-civil-registry.ico"
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Required file not found: $file"
            }
          }

      - name: Build application
        run: |
          python -m PyInstaller --noconfirm --clean ChadCivilRegistry.spec

      - name: Verify application build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ChadCivilRegistry/ChadCivilRegistry.exe")) {
            throw "PyInstaller did not create the application executable."
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $compiler)) {
            throw "Inno Setup compiler was not found: $compiler"
          }

          & $compiler "installer\ChadCivilRegistry.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed to build the installer."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          if (!(Test-Path "dist/installer/ChadCivilRegistry-Setup.exe")) {
            throw "Windows installer was not created."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ChadCivilRegistry-Installer
          path: dist/installer/ChadCivilRegistry-Setup.exe
          if-no-files-found: error
